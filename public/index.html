<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Database Vercel</title>
    <style>
        :root { --primary: #4a90e2; --bg: #f4f7f6; --text: #333; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { width: 100%; max-width: 400px; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: var(--primary); }
        input, button { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { background-color: var(--primary); color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #357abd; }
        .auth-toggle { text-align: center; font-size: 14px; cursor: pointer; color: var(--primary); }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="auth-title">Login Database</h1>
        <input type="text" id="username" placeholder="Username (contoh: abur)">
        <input type="password" id="password" placeholder="Password (contoh: 123)">
        <button onclick="handleAuth()" id="auth-btn">Masuk</button>
        <p class="auth-toggle" onclick="toggleAuthMode()" id="auth-switch">Belum punya akun? Daftar</p>
    </div>

    <script>
        let isLoginMode = true;
        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').innerText = isLoginMode ? 'Login Database' : 'Daftar Akun Baru';
            document.getElementById('auth-btn').innerText = isLoginMode ? 'Masuk' : 'Daftar';
            document.getElementById('auth-switch').innerText = isLoginMode ? 'Belum punya akun? Daftar' : 'Sudah punya akun? Login';
        }

        async function handleAuth() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!username || !password) return alert("Isi Username dan Password!");

            const endpoint = isLoginMode ? '/api/login' : '/api/register';
            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('loggedInUser', username);
                    window.location.href = '/atok.html';
                } else {
                    alert(data.error || "Terjadi kesalahan");
                }
            } catch (err) {
                alert("Koneksi ke server gagal!");
            }
        }
    </script>
</body>
</html>

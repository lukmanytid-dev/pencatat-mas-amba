<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aplikasi Pencatat</title>
    <style>
        :root { --primary: #4a90e2; --bg: #f4f7f6; --text: #333; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { width: 100%; max-width: 400px; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: var(--primary); margin-bottom: 20px; }
        input, button { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { background-color: var(--primary); color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #357abd; }
        .auth-toggle { text-align: center; font-size: 14px; cursor: pointer; color: var(--primary); margin-top: 10px; }
    </style>
</head>
<body>

    <!-- BAGIAN LOGIN / REGISTER -->
    <div class="container" id="auth-section">
        <h1 id="auth-title">Login</h1>
        <input type="text" id="username" placeholder="Masukkan Username">
        <input type="password" id="password" placeholder="Masukkan Password">
        <button onclick="handleAuth()" id="auth-btn">Masuk</button>
        <p class="auth-toggle" onclick="toggleAuthMode()" id="auth-switch">Belum punya akun? Daftar di sini</p>
    </div>

    <!-- Panggil Javascript -->
    <script src="abur.js"></script>
</body>
</html>

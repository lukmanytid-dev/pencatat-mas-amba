<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Pencatat & Kalkulator</title>
    <style>
        :root { --primary: #4a90e2; --bg: #f4f7f6; --text: #333; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1, h2, h3 { text-align: center; color: var(--primary); }
        input, textarea, button { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { background-color: var(--primary); color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #357abd; }
        .btn-danger { background-color: #e74c3c; }
        .btn-danger:hover { background-color: #c0392b; }
        
        /* Note Cards */
        .note-card { background: #fff; border-left: 5px solid var(--primary); padding: 15px; margin-bottom: 15px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: relative; }
        .note-stats { background: #e8f4fd; padding: 10px; border-radius: 5px; font-size: 13px; margin-top: 10px; color: #2c3e50; }
        .delete-btn { position: absolute; top: 15px; right: 15px; width: auto; padding: 5px 10px; background: #ff4c4c; font-size: 12px; margin: 0; }
        
        /* Tables */
        .table-section { background: #fafafa; border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-bottom: 25px; }
        .input-row { display: flex; gap: 10px; }
        .input-row input { flex: 1; }
        .input-row button { width: 120px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
        th { background-color: var(--primary); color: white; }
        tfoot { font-weight: bold; background-color: #e8f4fd; }
        .delete-td { text-align: center; width: 50px; cursor: pointer; color: red; font-weight: bold; }
        
        #app-section { display: none; }
        .auth-toggle { text-align: center; font-size: 14px; cursor: pointer; color: var(--primary); }
    </style>
</head>
<body>

    <!-- BAGIAN LOGIN / REGISTER -->
    <div class="container" id="auth-section">
        <h1 id="auth-title">Login</h1>
        <input type="text" id="username" placeholder="Masukkan Username">
        <input type="password" id="password" placeholder="Masukkan Password">
        <button onclick="handleAuth()" id="auth-btn">Masuk</button>
        <p class="auth-toggle" onclick="toggleAuthMode()" id="auth-switch">Belum punya akun? Daftar di sini</p>
    </div>

    <!-- BAGIAN APLIKASI CATATAN & TABEL -->
    <div class="container" id="app-section">
        <h2>Halo, <span id="user-display"></span>!</h2>
        <button onclick="logout()" class="btn-danger" style="margin-bottom: 20px;">Logout</button>
        
        <!-- TABEL RUSDI BARBERSHOP -->
        <div class="table-section">
            <h3>💈 Tabel Rusdi Barbershop</h3>
            <div class="input-row">
                <input type="text" id="rusdiDesc" placeholder="Keterangan (Cukur Rambut, dll)">
                <input type="number" id="rusdiAmount" placeholder="Nominal (Rp)">
                <button onclick="addTableData('rusdi')">Tambah</button>
            </div>
            <table>
                <thead><tr><th>Keterangan</th><th>Nominal (Rp)</th><th>Hapus</th></tr></thead>
                <tbody id="rusdiTableBody"></tbody>
                <tfoot><tr><td>Total Pemasukan</td><td colspan="2" id="rusdiTotal">Rp 0</td></tr></tfoot>
            </table>
        </div>

        <!-- TABEL SOSIS GORENG MAS AMBA -->
        <div class="table-section">
            <h3>🌭 Tabel Sosis Goreng Mas Amba</h3>
            <div class="input-row">
                <input type="text" id="ambaDesc" placeholder="Keterangan (Jual Sosis, Saos, dll)">
                <input type="number" id="ambaAmount" placeholder="Nominal (Rp)">
                <button onclick="addTableData('amba')">Tambah</button>
            </div>
            <table>
                <thead><tr><th>Keterangan</th><th>Nominal (Rp)</th><th>Hapus</th></tr></thead>
                <tbody id="ambaTableBody"></tbody>
                <tfoot><tr><td>Total Pemasukan</td><td colspan="2" id="ambaTotal">Rp 0</td></tr></tfoot>
            </table>
        </div>

        <hr style="margin: 30px 0; border: 1px solid #ddd;">

        <!-- CATATAN UMUM -->
        <h3>📝 Catatan Umum</h3>
        <input type="text" id="noteTitle" placeholder="Judul Catatan">
        <textarea id="noteContent" rows="3" placeholder="Tulis catatan (contoh: Apel 5000)"></textarea>
        <button onclick="addNote()">Simpan Catatan & Hitung</button>

        <div id="notesContainer"></div>
    </div>

    <script>
        let isLoginMode = true;
        let currentUser = null;

        // --- SISTEM AKUN ---
        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').innerText = isLoginMode ? 'Login' : 'Daftar Akun Baru';
            document.getElementById('auth-btn').innerText = isLoginMode ? 'Masuk' : 'Daftar';
            document.getElementById('auth-switch').innerText = isLoginMode ? 'Belum punya akun? Daftar' : 'Sudah punya akun? Login';
        }

        function handleAuth() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            if (!user || !pass) return alert("Isi Username dan Password!");

            let usersDB = JSON.parse(localStorage.getItem('usersDB')) || {};
            if (isLoginMode) {
                if (usersDB[user] === pass) login(user);
                else alert("Username/Password salah!");
            } else {
                if (usersDB[user]) alert("Username sudah terdaftar!");
                else { usersDB[user] = pass; localStorage.setItem('usersDB', JSON.stringify(usersDB)); login(user); }
            }
        }

        function login(username) {
            currentUser = username;
            document.getElementById('user-display').innerText = username;
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('app-section').style.display = 'block';
            renderNotes();
            renderTables();
        }

        function logout() {
            currentUser = null;
            document.getElementById('auth-section').style.display = 'block';
            document.getElementById('app-section').style.display = 'none';
        }

        // --- SISTEM TABEL RUSDI & MAS AMBA ---
        function getTableData(tableName) {
            const db = JSON.parse(localStorage.getItem(tableName + 'DB')) || {};
            return db[currentUser] || [];
        }

        function saveTableData(tableName, data) {
            let db = JSON.parse(localStorage.getItem(tableName + 'DB')) || {};
            db[currentUser] = data;
            localStorage.setItem(tableName + 'DB', JSON.stringify(db));
        }

        function addTableData(tableName) {
            const descInput = document.getElementById(tableName + 'Desc');
            const amountInput = document.getElementById(tableName + 'Amount');
            if (!descInput.value || !amountInput.value) return alert("Isi keterangan dan nominal!");

            const entry = { id: Date.now(), desc: descInput.value, amount: parseInt(amountInput.value) };
            let data = getTableData(tableName);
            data.push(entry);
            saveTableData(tableName, data);
            
            descInput.value = ""; amountInput.value = "";
            renderTables();
        }

        function deleteTableData(tableName, id) {
            let data = getTableData(tableName).filter(item => item.id !== id);
            saveTableData(tableName, data);
            renderTables();
        }

        function renderTables() {
            ['rusdi', 'amba'].forEach(tableName => {
                const tbody = document.getElementById(tableName + 'TableBody');
                const tfoot = document.getElementById(tableName + 'Total');
                const data = getTableData(tableName);
                let total = 0;
                
                tbody.innerHTML = "";
                data.forEach(item => {
                    total += item.amount;
                    tbody.innerHTML += `
                        <tr>
                            <td>${item.desc}</td>
                            <td>Rp ${new Intl.NumberFormat('id-ID').format(item.amount)}</td>
                            <td class="delete-td" onclick="deleteTableData('${tableName}', ${item.id})">X</td>
                        </tr>
                    `;
                });
                tfoot.innerText = `Rp ${new Intl.NumberFormat('id-ID').format(total)}`;
            });
        }

        // --- SISTEM CATATAN ---
        function getNotes() {
            const db = JSON.parse(localStorage.getItem('notesDB')) || {};
            return db[currentUser] || [];
        }

        function saveNotes(notes) {
            let db = JSON.parse(localStorage.getItem('notesDB')) || {};
            db[currentUser] = notes;
            localStorage.setItem('notesDB', JSON.stringify(db));
        }

        function addNote() {
            const title = document.getElementById("noteTitle").value.trim() || "Tanpa Judul";
            const content = document.getElementById("noteContent").value.trim();
            if (!content) return alert("Isi catatan kosong!");

            const nums = content.match(/\d+/g);
            const total = nums ? nums.reduce((sum, n) => sum + parseInt(n), 0) : 0;
            const note = { id: Date.now(), title, content, total, date: new Date().toLocaleString("id-ID") };

            let notes = getNotes(); notes.unshift(note); saveNotes(notes);
            document.getElementById("noteTitle").value = ""; document.getElementById("noteContent").value = "";
            renderNotes();
        }

        function renderNotes() {
            const container = document.getElementById("notesContainer");
            container.innerHTML = ""; 
            getNotes().forEach(note => {
                const div = document.createElement("div"); div.classList.add("note-card");
                div.innerHTML = `
                    <button class="delete-btn" onclick="let n=getNotes().filter(i=>i.id!==${note.id});saveNotes(n);renderNotes()">X</button>
                    <h3 style="margin:0 0 5px 0;">${note.title}</h3>
                    <p style="white-space:pre-wrap; margin:0 0 10px 0;">${note.content}</p>
                    <div class="note-stats">💰 Total Angka: <strong>Rp ${new Intl.NumberFormat('id-ID').format(note.total)}</strong></div>
                `;
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
